<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>remark. — Markdown 演示文稿</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand" aria-label="remark 点">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>remark<span class="brand-dot">.</span></span>
        </div>
        <div class="topbar-center">让内容站在前面</div>
        <div class="topbar-actions">
          <button class="text-button theme-button" id="theme-button" type="button" aria-label="切换深浅主题">深色</button>
          <button class="text-button" id="open-button" type="button">打开 Markdown</button>
          <button class="text-button" id="download-button" type="button">下载</button>
          <button class="primary-button" id="present-button" type="button">
            <span class="play-icon" aria-hidden="true">▶</span> 开始放映 <kbd>S</kbd>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="editor-panel" aria-label="Markdown 编辑器">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">SOURCE</span>
              <h1>写下你的想法</h1>
            </div>
            <span class="file-label"><span id="file-name-top">slides.md</span> <span id="save-status">已保存</span></span>
          </div>
          <div class="editor-shell">
            <div class="editor-toolbar">
              <span class="editor-tab"><span class="file-icon">#</span> <span id="file-name-tab">slides.md</span></span>
              <div class="editor-toolbar-actions">
                <span class="toolbar-note">用 <code>---</code> 新建一页</span>
                <button class="vim-toggle" id="vim-button" type="button" aria-pressed="true">Vim 开</button>
              </div>
            </div>
            <textarea id="editor" spellcheck="false" aria-label="幻灯片 Markdown 内容"></textarea>
            <div class="editor-footer">
              <span id="editor-count">0 行 · 0 字</span>
              <span><strong class="vim-mode" id="vim-mode">NORMAL</strong> · 自动保存在本机浏览器</span>
            </div>
          </div>
          <div class="editor-tip"><span class="tip-spark">✳</span> 专注内容。标题、列表、图片和代码会自然排版。</div>
        </section>

        <section class="preview-panel" aria-label="幻灯片预览">
          <div class="panel-heading preview-heading">
            <div>
              <span class="eyebrow">PREVIEW</span>
              <h2>实时预览</h2>
            </div>
            <div class="preview-tools">
              <label class="font-picker">字体 <select id="font-select" aria-label="幻灯片字体"></select></label>
              <span class="live-dot" aria-hidden="true"></span><span>实时同步</span>
            </div>
          </div>
          <div class="preview-stage" id="preview-stage">
            <div class="preview-frame" id="preview-frame">
              <div class="reveal" id="deck">
                <div class="slides" id="slides"></div>
              </div>
              <span class="present-brand" hidden></span>
              <span class="present-credit">remark<span>.</span></span>
            </div>
            <div class="present-toolbar" id="present-toolbar">
              <button type="button" id="fullscreen-button" hidden>全屏 <kbd>F</kbd></button>
              <button type="button" id="exit-button" aria-label="退出放映">退出放映 <kbd>Esc</kbd></button>
            </div>
          </div>
          <div class="preview-footer">
            <div class="slide-controls">
              <button id="prev-button" type="button" aria-label="上一页">←</button>
              <span id="page-count">01 / 01</span>
              <button id="next-button" type="button" aria-label="下一页">→</button>
            </div>
            <span class="shortcut-hint">S 放映 · F 全屏 · P 演讲者视图 · O 总览 · ? 帮助</span>
          </div>
        </section>
      </main>
      <input id="file-input" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
